name: ci

on:
  pull_request:
    paths-ignore:
      - '.lefthook/**'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
    branches: [ "main" ]

jobs:
  tests:
    runs-on: mco-dev-small-x64
    env:
      RESERVE_AUDITOR_URL: https://auditor.mobilecoin.foundation/api
      FULL_SERVICE_URL: https://readonly-fs-mainnet.mobilecoin.com/wallet/v2
      MC_NETWORK: main
    strategy:
      matrix:
        node-version: [19.x]

    steps:
    - uses: mobilecoinofficial/gh-actions/checkout@v0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: mobilecoinofficial/gh-actions/setup-node@v0
      with:
        node-version: ${{ matrix.node-version }}
    - shell: bash
      run: |
        npm install
        npm run build
        npm run test


  lint-docker:
    runs-on: mco-dev-small-x64
    steps:
    - name: Run hadolint with reviewdog
      uses: mobilecoinofficial/gh-actions/lint-docker@v0

  lint-actions:
    runs-on: mco-dev-small-x64
    steps:
    - name: Lint GitHub Actions
      uses: mobilecoinofficial/gh-actions/lint-actions@v0

  lint-helm:
    runs-on: mco-dev-small-x64
    steps:
    - name: Lint Helm Charts
      uses: mobilecoinofficial/gh-actions/lint-helm@v0

  # Have one noop job at the end that passes if all the other checks pass.
  # This is so we can just have one "standard" check to add to the branch protections.
  workflow-ok:
    needs:
    - tests
    - lint-docker
    - lint-actions
    - lint-helm
    runs-on: mco-dev-small-x64
    steps:
    - name: All Checks OK!
      run: |
        true

